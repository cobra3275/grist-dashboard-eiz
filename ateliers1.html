<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ÉVALUATION DES ATELIERS 1 – EIZ CAZAUX 2026</title>

  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 10px;
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #263238;
    }

    h1 {
      text-align: center;
      margin: 0 0 12px;
      font-size: 26px;
      font-weight: 800;
    }

    .ateliers-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      width: 100%;
      min-height: calc(100vh - 90px);
    }

    .card {
      height: 100%;
      min-height: 0;
      border-radius: 18px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }

    .card:nth-child(1) {
      background: #f3e9ff;
    }

    .card:nth-child(2) {
      background: #e5f2ff;
    }

    .card:nth-child(3) {
      background: #e7f6e9;
    }

    .card-title {
      text-align: center;
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .atelier-chart {
      width: 100%;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pie-wrapper {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
    }

    .pie {
      width: 300px;
      height: 300px;
      max-width: 90%;
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .pie-legend {
      font-size: 14px;
      line-height: 2;
      text-align: left;
    }

    .pie-dot {
      display: inline-block;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      margin-right: 7px;
    }

    .empty {
      text-align: center;
      color: #78909c;
      font-size: 14px;
      margin-top: 20px;
    }

    @media (max-width: 900px) {
      .ateliers-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .pie {
        width: 240px;
        height: 240px;
      }
    }

    @media (max-width: 600px) {
      .ateliers-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <h1>ÉVALUATION DES ATELIERS 1 – EIZ CAZAUX 2026</h1>

  <div class="ateliers-grid">

    <div class="card">
      <div class="card-title">ATELIER 1</div>
      <div class="atelier-chart" id="atelier1"></div>
    </div>

    <div class="card">
      <div class="card-title">ATELIER 2</div>
      <div class="atelier-chart" id="atelier2"></div>
    </div>

    <div class="card">
      <div class="card-title">ATELIER 3</div>
      <div class="atelier-chart" id="atelier3"></div>
    </div>

  </div>

  <script>

    grist.ready({
      requiredAccess: 'read table'
    });

    function texte(v) {
      return String(v || '').trim();
    }

    function couleurReponse(nom, index) {

      const t = texte(nom).toUpperCase();

      if (t === 'OUI') {
        return '#2e9d50';
      }

      if (t === 'NON') {
        return '#d92b2b';
      }

      if (
        t.includes("JE N'Y AI PAS PARTICIPÉ") ||
        t.includes("JE N’Y AI PAS PARTICIPÉ") ||
        t.includes("JE N'Y AI PAS PARTICIPE") ||
        t.includes("JE N’Y AI PAS PARTICIPE")
      ) {
        return '#94a3b8';
      }

      const couleurs = [
        '#7c3aed',
        '#3b82f6',
        '#22c55e',
        '#f59e0b',
        '#ef4444',
        '#06b6d4',
        '#ec4899',
        '#84cc16'
      ];

      return couleurs[index % couleurs.length];
    }


    function renderAtelierPie(elementId, counts) {

      const el = document.getElementById(elementId);

      const entries = Object.entries(counts);

      if (!entries.length) {
        el.innerHTML =
          '<div class="empty">Aucune réponse</div>';
        return;
      }

      const total = entries.reduce(
        (sum, [, nb]) => sum + nb,
        0
      );

      let depart = 0;

      const portions = [];

      entries.forEach(([nom, nb], index) => {

        const pct = (nb / total) * 100;

        const fin = depart + pct;

        const couleur =
          couleurReponse(nom, index);

        portions.push(
          `${couleur} ${depart}% ${fin}%`
        );

        depart = fin;
      });


      el.innerHTML = `
        <div class="pie-wrapper">

          <div
            class="pie"
            style="
              background:
              conic-gradient(
                ${portions.join(',')}
              );
            ">
          </div>

          <div class="pie-legend">

            ${entries.map(
              ([nom, nb], index) => {

                const pct =
                  Math.round(
                    (nb / total) * 1000
                  ) / 10;

                const couleur =
                  couleurReponse(
                    nom,
                    index
                  );

                return `
                  <div>

                    <span
                      class="pie-dot"
                      style="
                        background:
                        ${couleur}
                      ">
                    </span>

                    ${nom} : ${pct}%

                  </div>
                `;
              }
            ).join('')}

          </div>

        </div>
      `;
    }


    grist.onRecords(function(records) {

      const atelier1 = {};
      const atelier2 = {};
      const atelier3 = {};

      records.forEach(r => {

        const v1 = texte(
          r[
            'Atelier_1_Detection_identification_prelevement'
          ]
        );

        const v2 = texte(
          r[
            'Atelier_2_Cellule_analyse_interservice'
          ]
        );

        const v3 = texte(
          r[
            'Atelier_3_Coordination_interservice'
          ]
        );


        if (v1) {
          atelier1[v1] =
            (atelier1[v1] || 0) + 1;
        }

        if (v2) {
          atelier2[v2] =
            (atelier2[v2] || 0) + 1;
        }

        if (v3) {
          atelier3[v3] =
            (atelier3[v3] || 0) + 1;
        }

      });


      renderAtelierPie(
        'atelier1',
        atelier1
      );

      renderAtelierPie(
        'atelier2',
        atelier2
      );

      renderAtelierPie(
        'atelier3',
        atelier3
      );

    });

  </script>

</body>
</html>
