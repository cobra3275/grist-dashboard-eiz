<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ÉVALUATION JEU DIRIGÉ – EIZ CAZAUX 2026</title>

  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 10px;
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #263238;
    }

    h1 {
      text-align: center;
      margin: 0 0 12px;
      font-size: 26px;
      font-weight: 800;
    }

    .ateliers-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      width: 100%;
      min-height: calc(100vh - 90px);
    }

    .card {
      height: 100%;
      min-height: 0;
      border-radius: 18px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      background: #f3e9ff;
    }

    .card-title {
      text-align: center;
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .atelier-subtitle {
      display: inline-block;
      margin-top: 8px;
      font-size: 14px;
      font-weight: 400;
      line-height: 1.3;
    }

    .atelier-chart {
      width: 100%;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pie-wrapper {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
    }

    .pie {
      width: 300px;
      height: 300px;
      max-width: 90%;
      aspect-ratio: 1 / 1;
      flex-shrink: 0;
    }

    .pie svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .pie-legend {
      font-size: 14px;
      line-height: 2;
      text-align: left;
    }

    .pie-dot {
      display: inline-block;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      margin-right: 7px;
    }

    .empty {
      text-align: center;
      color: #78909c;
      font-size: 14px;
      margin-top: 20px;
    }

    @media (max-width: 900px) {
      .pie {
        width: 240px;
        height: 240px;
      }
    }
  </style>
</head>

<body>

  <h1>ÉVALUATION DES ATELIERS – EIZ CAZAUX 2026</h1>

  <div class="ateliers-grid">

    <div class="card">
      <div class="card-title">
        JEU DIRIGÉ<br>
        <span class="atelier-subtitle">
          Coordination et réflexion interservices
        </span>
      </div>

      <div class="atelier-chart" id="atelier1"></div>
    </div>

  </div>

  <script>

    grist.ready({
      requiredAccess: 'read table'
    });

    function texte(v) {
      return String(v || '').trim();
    }

    function couleurReponse(nom, index) {

      const t = texte(nom).toUpperCase();

      if (t === 'OUI') {
        return '#2e9d50';
      }

      if (t === 'NON') {
        return '#d92b2b';
      }

      if (
        t.includes("JE N'Y AI PAS PARTICIPÉ") ||
        t.includes("JE N’Y AI PAS PARTICIPÉ") ||
        t.includes("JE N'Y AI PAS PARTICIPE") ||
        t.includes("JE N’Y AI PAS PARTICIPE")
      ) {
        return '#94a3b8';
      }

      const couleurs = [
        '#7c3aed',
        '#3b82f6',
        '#22c55e',
        '#f59e0b',
        '#ef4444',
        '#06b6d4',
        '#ec4899',
        '#84cc16'
      ];

      return couleurs[index % couleurs.length];
    }


    function renderAtelierPie(elementId, counts) {

      const el = document.getElementById(elementId);
      const prioriteReponse = nom => {
  const t = texte(nom).toUpperCase();

  if (t === 'OUI') {
    return 1;
  }

  if (t === 'NON') {
    return 2;
  }

  if (
    t.includes("JE N'Y AI PAS PARTICIPÉ") ||
    t.includes("JE N’Y AI PAS PARTICIPÉ") ||
    t.includes("JE N'Y AI PAS PARTICIPE") ||
    t.includes("JE N’Y AI PAS PARTICIPE")
  ) {
    return 3;
  }

  return 4;
};

const entries = Object.entries(counts)
  .sort((a, b) => prioriteReponse(a[0]) - prioriteReponse(b[0]));

      if (!entries.length) {
        el.innerHTML =
          '<div class="empty">Aucune réponse</div>';
        return;
      }

      const total = entries.reduce(
        (sum, [, nb]) => sum + nb,
        0
      );

      const cx = 120;
      const cy = 120;
      const rayon = 105;
      let angleDepart = -90;

      function coordonnees(angle) {

        const rad = (angle * Math.PI) / 180;

        return {
          x: cx + rayon * Math.cos(rad),
          y: cy + rayon * Math.sin(rad)
        };
      }

      const secteurs = entries.map(
        ([nom, nb], index) => {

          const pct = nb / total;
          const angle = pct * 360;
          const couleur =
            couleurReponse(nom, index);

          if (pct >= 0.999999) {

            angleDepart += angle;

            return `
              <circle
                cx="${cx}"
                cy="${cy}"
                r="${rayon}"
                fill="${couleur}">
              </circle>
            `;
          }

          const debut =
            coordonnees(angleDepart);

          const angleFin =
            angleDepart + angle;

          const fin =
            coordonnees(angleFin);

          const grandArc =
            angle > 180 ? 1 : 0;

          const chemin = `
            M ${cx} ${cy}
            L ${debut.x} ${debut.y}
            A ${rayon} ${rayon}
            0 ${grandArc} 1
            ${fin.x} ${fin.y}
            Z
          `;

          angleDepart = angleFin;

          return `
            <path
              d="${chemin}"
              fill="${couleur}">
            </path>
          `;
        }
      ).join('');


      el.innerHTML = `
        <div class="pie-wrapper">

          <div class="pie">

            <svg
              viewBox="0 0 240 240"
              xmlns="http://www.w3.org/2000/svg"
              aria-hidden="true">

              ${secteurs}

            </svg>

          </div>

          <div class="pie-legend">

            ${entries.map(
              ([nom, nb], index) => {

                const pct =
                  Math.round(
                    (nb / total) * 1000
                  ) / 10;

                const couleur =
                  couleurReponse(
                    nom,
                    index
                  );

                return `
                  <div>
                    <span
                      class="pie-dot"
                      style="background:${couleur}">
                    </span>

                    ${nom} : ${pct}%
                  </div>
                `;
              }
            ).join('')}

          </div>

        </div>
      `;
    }


    grist.onRecords(function(records) {

      const atelier1 = {};

      records.forEach(r => {

        const v1 = texte(
          r['Jeu_dirige']
        );

        if (v1) {
          atelier1[v1] =
            (atelier1[v1] || 0) + 1;
        }

      });


      renderAtelierPie(
        'atelier1',
        atelier1
      );

    });

  </script>

</body>
</html>
