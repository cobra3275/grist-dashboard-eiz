<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Synthèse RETEX – EIZ Cazaux 2026</title>

  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 6px;
      font-family: Arial, sans-serif;
      background: #fff;
      color: #263238;
    }

    h1 {
      text-align: center;
      margin: 0 0 6px;
      font-size: 24px;
    }

    .kpis {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 6px;
    }

    .kpi {
      border-radius: 18px;
      padding: 12px;
      text-align: center;
    }

    .kpi.retex { background: #e8f1ff; }
    .kpi.note  { background: #e8f7ec; }

    .kpi-title {
      font-size: 12px;
      font-weight: 700;
    }

    .kpi-value {
      font-size: 34px;
      font-weight: 800;
      margin-top: 3px;
    }

    .retex .kpi-value { color: #1565c0; }
    .note .kpi-value  { color: #188038; }

    .top-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 6px;
    }

    .bottom-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
    }

    .card {
      border-radius: 18px;
      padding: 12px;
      min-height: 130px;
    }

    .participants { background: #f3e9ff; }
    .organismes   { background: #e5f2ff; }
    .accueil      { background: #e7f6e9; }
    .restauration { background: #fff4dc; }
    .site         { background: #e8f4f4; }
    .duree        { background: #f7e9f1; }
    .rythme       { background: #eeeafd; }

    .card-title {
      text-align: center;
      font-size: 13px;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .results {
      font-size: 12px;
      line-height: 1.45;
    }

    .result-row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      border-bottom: 1px solid rgba(0,0,0,.08);
      padding: 3px 0;
    }

    .result-row:last-child {
      border-bottom: none;
    }

    .label {
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .value {
      font-weight: 700;
      white-space: nowrap;
    }
.satisfaction-chart {
  display: flex;
  flex-direction: column;
  gap: 5px;
  margin-top: 8px;
  font-size: 11px;
}
   .sat-row {
  display: grid;
  grid-template-columns: 1fr 32px;
  gap: 5px;
  align-items: center;
}

.sat-bar {
  height: 10px;
  border-radius: 6px;
}

.sat-good { background: #2e9d50; }
.sat-medium { background: #f5a623; }
.sat-bad { background: #d92b2b; }

.sat-value {
  font-weight: 700;
  text-align: right;
}
    .bar-chart {
  display: flex;
  flex-direction: column;
  gap: 7px;
  margin-top: 8px;
}

.bar-row {
  display: grid;
  grid-template-columns: 120px 1fr 42px;
  align-items: center;
  gap: 8px;
  font-size: 12px;
}

.bar-label {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.bar-track {
  height: 14px;
  border-radius: 7px;
  background: rgba(255,255,255,0.75);
  overflow: hidden;
}

.bar-fill {
  height: 100%;
  border-radius: 7px;
  background: #8e5fd2;
}

.bar-value {
  text-align: right;
  font-weight: 700;
}
    .empty {
      text-align: center;
      color: #78909c;
      margin-top: 8px;
      font-size: 12px;
    }
.questions-row {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
  margin-top: 8px;
}

.question-card {
  min-height: 180px;
  border-radius: 18px;
  padding: 12px;
  box-sizing: border-box;
}

.question-card:nth-child(1) {
  background: #e8f5e9;
}

.question-card:nth-child(2) {
  background: #eaf4fc;
}

.question-card:nth-child(3) {
  background: #fff4d9;
}

.question-card .card-title {
  text-align: center;
  font-weight: 700;
  font-size: 12px;
  margin-bottom: 12px;
}
    .reponse-libre {
  background: rgba(255,255,255,0.7);
  border-radius: 10px;
  padding: 8px 10px;
  margin-bottom: 8px;
  font-size: 12px;
  line-height: 1.4;
}
   .donut-wrapper {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 20px;
  margin-top: 15px;
}

.donut {
  width: 105px;
  height: 105px;
  border-radius: 50%;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}

.donut::after {
  content: "";
  position: absolute;
  width: 62px;
  height: 62px;
  background: white;
  border-radius: 50%;
}

.donut-center {
  position: relative;
  z-index: 2;
  font-size: 22px;
  font-weight: 700;
}

.donut-legend {
  font-size: 12px;
  line-height: 2;
}

.legend-dot {
  display: inline-block;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  margin-right: 6px;
}

.legend-dot.oui {
  background: #2e9d50;
}

.legend-dot.non {
  background: #d92b2b;
} 
    .pie-wrapper {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 18px;
  margin-top: 10px;
}

.pie {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  flex-shrink: 0;
}

.pie-legend {
  font-size: 11px;
  line-height: 1.8;
}

.pie-dot {
  display: inline-block;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  margin-right: 6px;
}
  </style>
</head>

<body>

  <h1>SYNTHÈSE RETEX – EIZ CAZAUX 2026</h1>

  <div class="kpis">
    <div class="kpi retex">
      <div class="kpi-title">NOMBRE DE RETEX</div>
      <div class="kpi-value" id="nombreRetex">0</div>
    </div>

    <div class="kpi note">
      <div class="kpi-title">SENTIMENT GÉNÉRAL / 5</div>
      <div class="kpi-value" id="moyenne">0</div>
    </div>
  </div>

  <div class="top-grid">
    <div class="card participants">
      <div class="card-title">PARTICIPANTS</div>
      <div class="bar-chart" id="fonction"></div>
    </div>

    <div class="card organismes">
      <div class="card-title">RÉPARTITION SERVICES / ORGANISMES</div>
      <div class="bar-chart" id="organisme"></div>
    </div>
  </div>

  <div class="bottom-grid">
    <div class="card accueil">
      <div class="card-title">ACCUEIL SUR SITE</div>
      <div class="satisfaction-chart" id="accueil"></div>
    </div>

    <div class="card restauration">
      <div class="card-title">RESTAURATION</div>
      <div class="satisfaction-chart" id="restauration"></div>
    </div>

    <div class="card site">
      <div class="card-title">SITE DE MANŒUVRE</div>
      <div class="results" id="site"></div>
    </div>

    <div class="card duree">
      <div class="card-title">DURÉE DE L’EIZ</div>
      <div class="satisfaction-chart" id="duree"></div>
    </div>

    <div class="card rythme">
      <div class="card-title">RYTHME DE L’EIZ</div>
      <div class="results" id="rythme"></div>
    </div>
  </div>
<div class="questions-row">

  <div class="question-card">
    <div class="card-title">SOUHAITEZ-VOUS PARTICIPER À UN PROCHAIN EIZ ?</div>
    <div id="prochainEIZ"></div>
  </div>

  <div class="question-card">
    <div class="card-title">RECOMMANDERIEZ-VOUS CET EIZ ?</div>
    <div id="recommandationEIZ"></div>
  </div>

  

</div>

  
  <script>
function renderBarChart(elementId, counts) {
  const el = document.getElementById(elementId);
  const entries = Object.entries(counts);

  if (!entries.length) {
    el.innerHTML = '<div class="empty">Aucune réponse</div>';
    return;
  }

  

  const max = Math.max(...entries.map(([label, value]) => value));

  el.innerHTML = entries.map(([label, value]) => `
    <div class="bar-row">
      <div class="bar-label">${label}</div>
      <div class="bar-track">
        <div class="bar-fill" style="width:${(value / max) * 100}%"></div>
      </div>
      <div class="bar-value">${value}</div>
    </div>
  `).join('');
}
  function renderDonutChart(elementId, counts) {
  const el = document.getElementById(elementId);
  const entries = Object.entries(counts);

  if (!entries.length) {
    el.innerHTML = '<div class="empty">Aucune réponse</div>';
    return;
  }

    

  const total = entries.reduce((sum, [, nb]) => sum + nb, 0);

  const oui = entries
    .filter(([nom]) => texte(nom).toUpperCase() === 'OUI')
    .reduce((sum, [, nb]) => sum + nb, 0);

  const non = entries
    .filter(([nom]) => texte(nom).toUpperCase() === 'NON')
    .reduce((sum, [, nb]) => sum + nb, 0);

  const pctOui = Math.round((oui / total) * 1000) / 10;
  const pctNon = Math.round((non / total) * 1000) / 10;

  el.innerHTML = `
    <div class="donut-wrapper">
      <div class="donut" style="background:
        conic-gradient(
          #2e9d50 0 ${pctOui}%,
          #d92b2b ${pctOui}% 100%
        );">
        <div class="donut-center">${total}</div>
      </div>

      <div class="donut-legend">
        <div><span class="legend-dot oui"></span> OUI : ${pctOui}%</div>
        <div><span class="legend-dot non"></span> NON : ${pctNon}%</div>
      </div>
    </div>
  `;
}
    function renderPieChart(elementId, counts) {
  const el = document.getElementById(elementId);
  const entries = Object.entries(counts);

  if (!entries.length) {
    el.innerHTML = '<div class="empty">Aucune réponse</div>';
    return;
  }

  const total = entries.reduce((sum, [, nb]) => sum + nb, 0);

  const couleurs = [
    '#7c3aed',
    '#3b82f6',
    '#22c55e',
    '#f59e0b',
    '#ef4444',
    '#06b6d4',
    '#ec4899',
    '#84cc16'
  ];

  let depart = 0;
  const portions = [];

  entries.forEach(([nom, nb], index) => {
    const pct = (nb / total) * 100;
    const fin = depart + pct;
    portions.push(`${couleurs[index % couleurs.length]} ${depart}% ${fin}%`);
    depart = fin;
  });

  el.innerHTML = `
    <div class="pie-wrapper">
      <div class="pie" style="background: conic-gradient(${portions.join(',')});"></div>
      <div class="pie-legend">
        ${entries.map(([nom, nb], index) => {
          const pct = Math.round((nb / total) * 1000) / 10;
          return `
            <div>
              <span class="pie-dot" style="background:${couleurs[index % couleurs.length]}"></span>
              ${nom} : ${pct}%
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `;
}
    function renderSatisfaction(elementId, records, columnName) {
  const el = document.getElementById(elementId);

  const valeurs = records
    .map(r => texte(r[columnName]))
    .filter(Boolean);

  if (!valeurs.length) {
    el.innerHTML = '<div class="empty">Aucune réponse</div>';
    return;
  }

  const compte = {};

  valeurs.forEach(v => {
    compte[v] = (compte[v] || 0) + 1;
  });

  const total = valeurs.length;

  const lignes = Object.entries(compte)
    .sort((a, b) => b[1] - a[1])
    .map(([nom, nb]) => {

      const pct = Math.round((nb / total) * 1000) / 10;

      let classe = 'sat-medium';

      const texteNom = nom.toUpperCase();

      if (
  texteNom.includes('TRÈS SATISFAIT') ||
  texteNom.includes('SATISFAIT') ||
  texteNom.includes('TRÈS BON') ||
  texteNom === 'EXCELLENT' ||
  
  texteNom === 'ADAPTÉE' ||
  texteNom === 'OUI'
) {
  classe = 'sat-good';
}

if (
  texteNom === 'À AMÉLIORER' ||
  texteNom === 'A AMÉLIORER' ||
  texteNom === 'NON' ||
  texteNom === 'TROP LONGUE' ||
  texteNom === 'TROP SOUTENU'
) {
  classe = 'sat-bad';
}
      return `
        <div class="sat-row">
          <div>
            <div>${nom}</div>
            <div class="sat-bar ${classe}" style="width:${pct}%"></div>
          </div>
          <div class="sat-value">${pct}%</div>
        </div>
      `;
    })
    .join('');

  el.innerHTML = lignes;
}
    grist.ready({
      requiredAccess: 'read table'
    });

    function texte(v) {
      return String(v || '').trim();
    }

    function afficherRepartition(records, colonne, elementId) {
      const valeurs = records
        .map(r => texte(r[colonne]))
        .filter(Boolean);

      const element = document.getElementById(elementId);

      if (!valeurs.length) {
        element.innerHTML =
          '<div class="empty">Aucune réponse</div>';
        return;
      }

      const compte = {};

      valeurs.forEach(v => {
        compte[v] = (compte[v] || 0) + 1;
      });

      const total = valeurs.length;

      const lignes = Object.entries(compte)
        .sort((a, b) => b[1] - a[1])
        .map(([nom, nb]) => {
          const pct = Math.round((nb / total) * 100);

          return `
            <div class="result-row">
              <span class="label">${nom}</span>
              <span class="value">${pct} %</span>
            </div>
          `;
        })
        .join('');

      element.innerHTML = lignes;
    }

    function noteNumerique(v) {
      const match = texte(v).match(/[\d,.]+/);

      if (!match) return null;

      const n = parseFloat(match[0].replace(',', '.'));

      return Number.isFinite(n) ? n : null;
    }

    grist.onRecords(function(records) {

      document.getElementById('nombreRetex').textContent =
        records.length;

      const notes = records
        .map(r => noteNumerique(r.Evaluation_generale))
        .filter(v => v !== null);

      const moyenne = notes.length
        ? (notes.reduce((a, b) => a + b, 0) / notes.length).toFixed(1)
        : '0';

      document.getElementById('moyenne').textContent =
        moyenne;

      const fonctions = {};

records.forEach(r => {
  const valeur = texte(r.Fonction);
  if (valeur) {
    fonctions[valeur] = (fonctions[valeur] || 0) + 1;
  }
});

renderPieChart('fonction', fonctions);
      const organismes = {};

records.forEach(r => {
  const valeur = texte(r.Organisme);
  if (valeur) {
    organismes[valeur] = (organismes[valeur] || 0) + 1;
  }
});

renderBarChart('organisme', organismes);
      renderSatisfaction('accueil', records, 'Accueil_sur_site');    
      renderSatisfaction('restauration', records, 'Restauration');
      renderSatisfaction('site', records, 'Site_de_manoeuvre');
      renderSatisfaction('duree', records, 'Duree_EIZ');
      renderSatisfaction('rythme', records, 'Rythme_EIZ');

    const prochainEIZ = {};

records.forEach(r => {
  const valeur = texte(r.Participer_prochain_EIZ);
  if (valeur) {
    prochainEIZ[valeur] = (prochainEIZ[valeur] || 0) + 1;
  }
});

renderDonutChart('prochainEIZ', prochainEIZ);
const recommandationEIZ = {};

records.forEach(r => {
  const valeur = texte(r.Recommander_EIZ);
  if (valeur) {
    recommandationEIZ[valeur] = (recommandationEIZ[valeur] || 0) + 1;
  }
});

renderDonutChart('recommandationEIZ', recommandationEIZ);


      
      
    });
  </script>

</body>
</html>
